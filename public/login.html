<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Sign in · SignWise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <main class="auth-shell">
      <aside
        class="auth-panel auth-panel--brand"
        data-auth-brand
        data-subtext="Start learning sign language today."
      ></aside>

      <section class="auth-panel auth-panel--form">
        <a class="auth-back" href="landing.html">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path
              d="M12.5 8H3.5M7.5 4L3.5 8l4 4"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          Back to home
        </a>
        <div class="auth-card">
          <section class="auth-view" id="view-register" aria-labelledby="register-title">
            <h2 class="auth-title" id="register-title">Create your account</h2>
            <p class="auth-subtitle">Sign up and start learning ASL today.</p>
            <form class="auth-form" id="register-form" novalidate>
              <div class="field">
                <label for="register-name">Full name</label>
                <input
                  id="register-name"
                  name="name"
                  type="text"
                  placeholder="Enter your name"
                  autocomplete="name"
                  data-validate="name"
                  aria-describedby="register-name-error"
                  aria-invalid="false"
                />
                <p class="field-error" id="register-name-error" role="alert" hidden></p>
              </div>

              <div class="field">
                <label for="register-email">Email</label>
                <input
                  id="register-email"
                  name="email"
                  type="email"
                  placeholder="you@example.com"
                  autocomplete="email"
                  data-validate="email"
                  aria-describedby="register-email-error"
                  aria-invalid="false"
                />
                <p class="field-error" id="register-email-error" role="alert" hidden></p>
              </div>

              <div class="field">
                <label for="register-password">Password</label>
                <div class="input-wrap">
                  <input
                    id="register-password"
                    name="password"
                    type="password"
                    placeholder="At least 8 characters"
                    autocomplete="new-password"
                    data-validate="password"
                    aria-describedby="register-password-error"
                    aria-invalid="false"
                  />
                  <button
                    type="button"
                    class="field-toggle"
                    data-toggle="register-password"
                    aria-pressed="false"
                    aria-label="Show password"
                  >
                    Show
                  </button>
                </div>
                <p class="field-error" id="register-password-error" role="alert" hidden></p>
              </div>

              <div class="field">
                <label for="register-confirm">Confirm password</label>
                <div class="input-wrap">
                  <input
                    id="register-confirm"
                    name="confirm"
                    type="password"
                    placeholder="Re-enter your password"
                    autocomplete="new-password"
                    data-validate="confirm"
                    aria-describedby="register-confirm-error"
                    aria-invalid="false"
                  />
                  <button
                    type="button"
                    class="field-toggle"
                    data-toggle="register-confirm"
                    aria-pressed="false"
                    aria-label="Show password"
                  >
                    Show
                  </button>
                </div>
                <p class="field-error" id="register-confirm-error" role="alert" hidden></p>
              </div>

              <button type="submit" class="auth-submit">
                <span class="auth-submit__label">Create account</span>
                <span class="auth-submit__spinner" aria-hidden="true"></span>
              </button>
            </form>
            <p class="auth-footer">
              Already have an account?
              <button type="button" class="auth-link auth-link--strong" data-view="login">
                Log in
              </button>
            </p>
          </section>

          <section class="auth-view" id="view-login" aria-labelledby="login-title" hidden>
            <h2 class="auth-title" id="login-title">Welcome back</h2>
            <p class="auth-subtitle">Log in to continue learning ASL.</p>
            <form class="auth-form" id="login-form" novalidate>
              <div class="field">
                <label for="login-email">Email</label>
                <input
                  id="login-email"
                  name="email"
                  type="email"
                  placeholder="you@example.com"
                  autocomplete="email"
                  data-validate="email"
                  aria-describedby="login-email-error"
                  aria-invalid="false"
                />
                <p class="field-error" id="login-email-error" role="alert" hidden></p>
              </div>

              <div class="field">
                <label for="login-password">Password</label>
                <div class="input-wrap">
                  <input
                    id="login-password"
                    name="password"
                    type="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    data-validate="password"
                    aria-describedby="login-password-error"
                    aria-invalid="false"
                  />
                  <button
                    type="button"
                    class="field-toggle"
                    data-toggle="login-password"
                    aria-pressed="false"
                    aria-label="Show password"
                  >
                    Show
                  </button>
                </div>
                <p class="field-error" id="login-password-error" role="alert" hidden></p>
              </div>

              <div class="forgot-row">
                <a class="auth-link auth-link--strong" href="/forgot-password">
                  Forgot password?
                </a>
              </div>

              <button type="submit" class="auth-submit">
                <span class="auth-submit__label">Log in</span>
                <span class="auth-submit__spinner" aria-hidden="true"></span>
              </button>
            </form>
            <p class="auth-footer">
              New here?
              <button type="button" class="auth-link auth-link--strong" data-view="register">
                Create an account
              </button>
            </p>
          </section>
        </div>
      </section>
    </main>
    <script src="js/auth-layout.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
