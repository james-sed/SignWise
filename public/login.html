<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Sign in · SignWise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <main class="auth-shell">
      <aside class="auth-panel auth-panel--brand">
        <div class="brand-decor" aria-hidden="true">
          <span class="decor decor-icon decor-icon--camera">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2.5" y="7.5" width="19" height="12" rx="2.5" />
              <path d="M9 7.5l1-2h4l1 2" />
              <circle cx="12" cy="13.5" r="3.4" />
            </svg>
          </span>

          <span class="decor decor-icon decor-icon--chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z" />
              <circle cx="8" cy="12" r="0.9" fill="currentColor" stroke="none" />
              <circle cx="12" cy="12" r="0.9" fill="currentColor" stroke="none" />
              <circle cx="16" cy="12" r="0.9" fill="currentColor" stroke="none" />
            </svg>
          </span>

          <span class="decor decor-icon decor-icon--hand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 11V6.5a1.5 1.5 0 00-3 0V11" />
              <path d="M15 11V4.5a1.5 1.5 0 00-3 0V11" />
              <path d="M12 11V5a1.5 1.5 0 00-3 0v6" />
              <path d="M9 11V7a1.5 1.5 0 00-3 0v8a6 6 0 006 6h1a6 6 0 006-6v-4" />
            </svg>
          </span>

          <span class="decor decor-icon decor-icon--cap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10L12 5 2 10l10 5 10-5z" />
              <path d="M6 12v5c0 1 2.7 2.5 6 2.5s6-1.5 6-2.5v-5" />
              <path d="M22 10v6" />
            </svg>
          </span>

          <span class="decor decor-spiral decor-spiral--yellow">
            <svg viewBox="0 0 60 60">
              <path d="M30 30a3 3 0 11-3 3 6 6 0 109-4 10 10 0 11-14 12 15 15 0 1022-8" />
            </svg>
          </span>

          <span class="decor decor-spiral decor-spiral--teal">
            <svg viewBox="0 0 60 60">
              <path d="M30 30a3 3 0 11-3 3 6 6 0 109-4 10 10 0 11-14 12 15 15 0 1022-8" />
            </svg>
          </span>

          <span class="decor decor-dot decor-dot--coral-tl"></span>
          <span class="decor decor-dot decor-dot--coral-tr"></span>
          <span class="decor decor-dot decor-dot--white-tc"></span>
          <span class="decor decor-dot decor-dot--white-br"></span>
          <span class="decor decor-dot decor-dot--yellow-l"></span>
          <span class="decor decor-dot decor-dot--yellow-bl"></span>

          <span class="decor decor-arcs">
            <svg viewBox="0 0 520 320">
              <path d="M20 320a240 240 0 01480 0" />
              <path d="M80 320a180 180 0 01360 0" />
              <path d="M140 320a120 120 0 01240 0" />
              <path d="M200 320a60 60 0 01120 0" />
            </svg>
          </span>
        </div>

        <a class="auth-logo" href="landing.html" aria-label="SignWise home">
          <span class="auth-logo__mark" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M9 11.5V5.5a1.5 1.5 0 013 0v5M12 10.5V4a1.5 1.5 0 013 0v6.5M15 10.5V6a1.5 1.5 0 013 0v8c0 3.5-2 7-6 7s-6-2.5-7-5l-1.8-3.6a1.4 1.4 0 012.4-1.4L7 13"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <span class="auth-logo__text">SignWise</span>
        </a>

        <div class="brand-content">
          <h1 class="brand-headline">
            Learn sign<br />
            language,<br />
            one sign at<br />
            <span class="brand-headline__accent">
              a time.
              <svg class="brand-underline" viewBox="0 0 200 14" preserveAspectRatio="none" aria-hidden="true">
                <path d="M3 11C46 3 154 3 197 9" />
              </svg>
            </span>
          </h1>
          <p class="brand-subtext">Start learning sign language today.</p>
        </div>
      </aside>

      <section class="auth-panel auth-panel--form">
        <a class="auth-back" href="landing.html">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path
              d="M12.5 8H3.5M7.5 4L3.5 8l4 4"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          Back to home
        </a>
        <div class="auth-card">
          <section class="auth-view" id="view-register" aria-labelledby="register-title">
            <h2 class="auth-title" id="register-title">Create your account</h2>
            <p class="auth-subtitle">Sign up and start learning ASL today.</p>
            <form class="auth-form" id="register-form" novalidate>
              <div class="field">
                <label for="register-name">Full name</label>
                <input
                  id="register-name"
                  name="name"
                  type="text"
                  placeholder="Enter your name"
                  autocomplete="name"
                  data-validate="name"
                  aria-describedby="register-name-error"
                  aria-invalid="false"
                />
                <p class="field-error" id="register-name-error" role="alert" hidden></p>
              </div>

              <div class="field">
                <label for="register-email">Email</label>
                <input
                  id="register-email"
                  name="email"
                  type="email"
                  placeholder="you@example.com"
                  autocomplete="email"
                  data-validate="email"
                  aria-describedby="register-email-error"
                  aria-invalid="false"
                />
                <p class="field-error" id="register-email-error" role="alert" hidden></p>
              </div>

              <div class="field">
                <label for="register-password">Password</label>
                <div class="input-wrap">
                  <input
                    id="register-password"
                    name="password"
                    type="password"
                    placeholder="At least 8 characters"
                    autocomplete="new-password"
                    data-validate="password"
                    aria-describedby="register-password-error"
                    aria-invalid="false"
                  />
                  <button
                    type="button"
                    class="field-toggle"
                    data-toggle="register-password"
                    aria-pressed="false"
                    aria-label="Show password"
                  >
                    Show
                  </button>
                </div>
                <p class="field-error" id="register-password-error" role="alert" hidden></p>
              </div>

              <div class="field">
                <label for="register-confirm">Confirm password</label>
                <div class="input-wrap">
                  <input
                    id="register-confirm"
                    name="confirm"
                    type="password"
                    placeholder="Re-enter your password"
                    autocomplete="new-password"
                    data-validate="confirm"
                    aria-describedby="register-confirm-error"
                    aria-invalid="false"
                  />
                  <button
                    type="button"
                    class="field-toggle"
                    data-toggle="register-confirm"
                    aria-pressed="false"
                    aria-label="Show password"
                  >
                    Show
                  </button>
                </div>
                <p class="field-error" id="register-confirm-error" role="alert" hidden></p>
              </div>

              <button type="submit" class="auth-submit">
                <span class="auth-submit__label">Create account</span>
                <span class="auth-submit__spinner" aria-hidden="true"></span>
              </button>
            </form>
            <p class="auth-footer">
              Already have an account?
              <button type="button" class="auth-link auth-link--strong" data-view="login">
                Log in
              </button>
            </p>
          </section>

          <section class="auth-view" id="view-login" aria-labelledby="login-title" hidden>
            <h2 class="auth-title" id="login-title">Welcome back</h2>
            <p class="auth-subtitle">Log in to continue learning ASL.</p>
            <form class="auth-form" id="login-form" novalidate>
              <div class="field">
                <label for="login-email">Email</label>
                <input
                  id="login-email"
                  name="email"
                  type="email"
                  placeholder="you@example.com"
                  autocomplete="email"
                  data-validate="email"
                  aria-describedby="login-email-error"
                  aria-invalid="false"
                />
                <p class="field-error" id="login-email-error" role="alert" hidden></p>
              </div>

              <div class="field">
                <label for="login-password">Password</label>
                <div class="input-wrap">
                  <input
                    id="login-password"
                    name="password"
                    type="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    data-validate="password"
                    aria-describedby="login-password-error"
                    aria-invalid="false"
                  />
                  <button
                    type="button"
                    class="field-toggle"
                    data-toggle="login-password"
                    aria-pressed="false"
                    aria-label="Show password"
                  >
                    Show
                  </button>
                </div>
                <p class="field-error" id="login-password-error" role="alert" hidden></p>
              </div>

              <div class="forgot-row">
                <button type="button" class="auth-link auth-link--strong">
                  Forgot password?
                </button>
              </div>

              <button type="submit" class="auth-submit">
                <span class="auth-submit__label">Log in</span>
                <span class="auth-submit__spinner" aria-hidden="true"></span>
              </button>
            </form>
            <p class="auth-footer">
              New here?
              <button type="button" class="auth-link auth-link--strong" data-view="register">
                Create an account
              </button>
            </p>
          </section>
        </div>
      </section>
    </main>
    <script src="js/auth.js"></script>
  </body>
</html>
