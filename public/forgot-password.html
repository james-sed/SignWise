<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Forgot password · SignWise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <main class="auth-shell">
      <aside
        class="auth-panel auth-panel--brand"
        data-auth-brand
        data-subtext="Practice ASL with your webcam, at your own pace."
      ></aside>

      <section class="auth-panel auth-panel--form">
        <a class="auth-back" href="landing.html">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path
              d="M12.5 8H3.5M7.5 4L3.5 8l4 4"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          Back to home
        </a>
        <div class="auth-card">
          <section
            class="auth-view"
            id="view-request"
            aria-labelledby="forgot-title"
          >
            <div class="auth-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M7 10V8a5 5 0 0 1 10 0v2h.5A2.5 2.5 0 0 1 20 12.5v6A2.5 2.5 0 0 1 17.5 21h-11A2.5 2.5 0 0 1 4 18.5v-6A2.5 2.5 0 0 1 6.5 10H7Zm2 0h6V8a3 3 0 1 0-6 0v2Z"
                />
              </svg>
            </div>
            <h2 class="auth-title" id="forgot-title">Forgot password?</h2>
            <p class="auth-subtitle auth-subtitle--narrow">
              Enter your email and we'll send you a link to reset your
              password.
            </p>
            <form class="auth-form auth-form--forgot" id="forgot-form" novalidate>
              <div class="field">
                <label for="forgot-email">Email</label>
                <input
                  id="forgot-email"
                  name="email"
                  type="email"
                  inputmode="email"
                  placeholder="you@example.com"
                  autocomplete="email"
                  autocapitalize="none"
                  data-validate="email"
                  aria-describedby="forgot-email-error"
                  aria-invalid="false"
                />
                <p class="field-error" id="forgot-email-error" role="alert" hidden></p>
              </div>

              <button type="submit" class="auth-submit">
                <span class="auth-submit__label">Send reset link</span>
                <span class="auth-submit__spinner" aria-hidden="true"></span>
              </button>
              <p
                class="field-error form-error"
                id="forgot-form-error"
                role="alert"
                hidden
              ></p>
            </form>
            <p class="auth-footer">
              <a class="auth-back-link" href="login.html">
                <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <path
                    d="M12.5 8H3.5M7.5 4L3.5 8l4 4"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                Back to log in
              </a>
            </p>
          </section>

          <section
            class="auth-view"
            id="view-sent"
            aria-labelledby="sent-title"
            aria-live="polite"
            hidden
          >
            <div class="auth-icon" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="5" width="18" height="14" rx="2.5" />
                <path d="M3.5 7l7.6 5.4a1.6 1.6 0 0 0 1.8 0L20.5 7" />
                <path d="M9 14.5l2 2 4-4.5" />
              </svg>
            </div>
            <h2 class="auth-title" id="sent-title" tabindex="-1">
              Check your email
            </h2>
            <p class="auth-subtitle auth-subtitle--narrow" id="sent-message">
              If an account exists for <span id="sent-email"></span>, we've sent
              a link to reset your password. It expires in 30 minutes.
            </p>
            <button type="button" class="auth-submit auth-submit--resend" id="resend-button">
              <span class="auth-submit__label" id="resend-label">Resend email</span>
              <span class="auth-submit__spinner" aria-hidden="true"></span>
            </button>
            <p class="resend-note">Didn't get it? Check your spam folder.</p>
            <p
              class="field-error form-error"
              id="resend-error"
              role="alert"
              hidden
            ></p>
            <p class="auth-footer">
              <a class="auth-back-link" href="login.html">
                <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <path
                    d="M12.5 8H3.5M7.5 4L3.5 8l4 4"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                Back to log in
              </a>
            </p>
          </section>
        </div>
      </section>
    </main>
    <script src="js/auth-api.js"></script>
    <script src="js/auth-layout.js"></script>
    <script src="js/forgot-password.js"></script>
  </body>
</html>
